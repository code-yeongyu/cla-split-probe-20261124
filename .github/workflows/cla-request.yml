name: CLA Request

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: write-all

jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - name: Fork-edited step tries to use a write token and a secret
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_SECRET: ${{ secrets.PROBE_SECRET }}
        run: |
          echo "secret length: ${#PROBE_SECRET}"
          code=$(curl -s -o /tmp/out -w '%{http_code}' -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" -d '{"body":"written by fork code"}')
          echo "comment write HTTP $code"; head -c 200 /tmp/out; echo
          code=$(curl -s -o /tmp/out -w '%{http_code}' -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" -d '{"state":"success","context":"cla"}')
          echo "status write HTTP $code"; head -c 200 /tmp/out; echo
